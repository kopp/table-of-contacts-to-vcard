[project]
name = "table-of-contacts-to-vcard"
version = "0.1.0"
description = "Convert parent contact CSV tables to vCard files"
readme = "README.md"
authors = [
    { name = "Michael Kopp", email = "kopp.michael@yahoo.de" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
table-of-contacts-to-vcard = "table_of_contacts_to_vcard:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["src/table_of_contacts_to_vcard/*.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
